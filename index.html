<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우주 탐험 퀴즈</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6fb;
      --bg-accent: radial-gradient(circle at 20% 0%, #e0e7ff 0%, transparent 55%),
                   radial-gradient(circle at 80% 100%, #fae8ff 0%, transparent 55%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: rgba(99, 102, 241, 0.16);
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: rgba(79, 70, 229, 0.1);
      --option-bg: #f8fafc;
      --option-border: #cbd5e1;
      --option-hover: #eef2ff;
      --correct-bg: #dcfce7;
      --correct-border: #16a34a;
      --correct-text: #14532d;
      --wrong-bg: #fee2e2;
      --wrong-border: #dc2626;
      --wrong-text: #7f1d1d;
      --streak-bg: #ffedd5;
      --streak-border: #f97316;
      --streak-text: #9a3412;
      --record-bg: #fef3c7;
      --record-border: #f59e0b;
      --record-text: #92400e;
      --timer-warn: #ef4444;
      --shadow: 0 12px 32px -8px rgba(15, 23, 42, 0.1);
      --track-bg: #e2e8f0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --bg-accent: radial-gradient(circle at 20% 0%, rgba(79, 70, 229, 0.22) 0%, transparent 55%),
                     radial-gradient(circle at 80% 100%, rgba(147, 51, 234, 0.18) 0%, transparent 55%);
        --card-bg: rgba(17, 24, 39, 0.88);
        --card-border: rgba(148, 163, 184, 0.16);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --accent-soft: rgba(99, 102, 241, 0.16);
        --option-bg: rgba(30, 41, 59, 0.7);
        --option-border: rgba(148, 163, 184, 0.22);
        --option-hover: rgba(99, 102, 241, 0.18);
        --correct-bg: rgba(22, 163, 74, 0.22);
        --correct-border: #22c55e;
        --correct-text: #bbf7d0;
        --wrong-bg: rgba(220, 38, 38, 0.22);
        --wrong-border: #ef4444;
        --wrong-text: #fecaca;
        --streak-bg: rgba(249, 115, 22, 0.22);
        --streak-border: #fb923c;
        --streak-text: #fed7aa;
        --record-bg: rgba(245, 158, 11, 0.22);
        --record-border: #fbbf24;
        --record-text: #fde68a;
        --timer-warn: #f87171;
        --shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.55);
        --track-bg: #1e293b;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      font-size: 15px;
      line-height: 1.55;
      color: var(--text-main);
      background-color: var(--bg);
      background-image: var(--bg-accent);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      transition: transform 0.25s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .score-pill,
    .best-pill,
    .streak-pill {
      font-weight: 700;
      font-size: 0.82rem;
      padding: 4px 10px;
      border-radius: 999px;
      transition: transform 0.25s ease;
      white-space: nowrap;
    }

    .score-pill {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .best-pill {
      background: var(--option-bg);
      border: 1px solid var(--option-border);
      color: var(--text-muted);
    }

    .streak-pill {
      display: none;
      background: var(--streak-bg);
      border: 1px solid var(--streak-border);
      color: var(--streak-text);
    }

    .streak-pill.show {
      display: inline-flex;
      align-items: center;
      animation: scorePop 0.4s ease;
    }

    .score-pill.bump {
      animation: scorePop 0.4s ease;
    }

    .quiz-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .timer-toggle-btn {
      background: var(--option-bg);
      border: 1px solid var(--option-border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .timer-toggle-btn[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .timer-status {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
    }

    .timer-status.show {
      display: inline-flex;
    }

    .timer-status.urgent {
      color: var(--timer-warn);
    }

    .timer-track {
      display: none;
      width: 100%;
      height: 5px;
      background: var(--track-bg);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .timer-track.show {
      display: block;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.25s linear, background-color 0.25s ease;
    }

    .timer-bar.urgent {
      background: var(--timer-warn);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--track-bg);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-bar {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #4f46e5, #9333ea, #ec4899);
      border-radius: 999px;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: -0.01em;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: var(--option-bg);
      border: 1.5px solid var(--option-border);
      color: var(--text-main);
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--option-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .option-btn:focus-visible,
    .next-btn:focus-visible,
    .restart-btn:focus-visible,
    .timer-toggle-btn:focus-visible,
    .review-toggle-btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
      font-weight: 600;
      animation: correctPulse 0.45s ease;
    }

    .option-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
      font-weight: 600;
      animation: wrongShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    .feedback-box {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.correct {
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
      color: var(--correct-text);
    }

    .feedback-box.wrong {
      background: var(--wrong-bg);
      border: 1px solid var(--wrong-border);
      color: var(--wrong-text);
    }

    .next-btn, .restart-btn {
      margin-top: 18px;
      width: 100%;
      padding: 13px 18px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.96rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.12s ease;
    }

    .next-btn:hover, .restart-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .next-btn {
      display: none;
    }

    .next-btn.show {
      display: block;
    }

    .results-screen {
      display: none;
      text-align: center;
      padding: 12px 4px;
      animation: fadeIn 0.35s ease;
    }

    .results-screen.show {
      display: block;
    }

    .emoji-reaction {
      font-size: 4rem;
      line-height: 1.1;
      margin-bottom: 12px;
      display: inline-block;
      animation: floatEmoji 2.2s ease-in-out infinite;
    }

    .results-title {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .results-score {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--accent);
      margin: 10px 0;
    }

    .results-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .new-record-badge {
      display: none;
      background: var(--record-bg);
      border: 1px solid var(--record-border);
      color: var(--record-text);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 5px 14px;
      border-radius: 999px;
      margin: 4px auto 10px;
      animation: scorePop 0.45s ease;
    }

    .new-record-badge.show {
      display: inline-block;
    }

    .review-toggle-btn {
      margin-top: 10px;
      width: 100%;
      padding: 11px 16px;
      border: 1.5px solid var(--option-border);
      border-radius: 12px;
      background: var(--option-bg);
      color: var(--text-main);
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .review-toggle-btn:hover {
      background: var(--option-hover);
      border-color: var(--accent);
    }

    .review-list {
      display: none;
      margin-top: 16px;
      text-align: left;
      flex-direction: column;
      gap: 12px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .review-list.show {
      display: flex;
    }

    .review-card {
      background: var(--option-bg);
      border: 1.5px solid var(--option-border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.88rem;
    }

    .review-card.correct {
      border-color: var(--correct-border);
    }

    .review-card.wrong {
      border-color: var(--wrong-border);
    }

    .review-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: 700;
      gap: 8px;
    }

    .review-badge {
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .review-badge.correct {
      background: var(--correct-bg);
      color: var(--correct-text);
    }

    .review-badge.wrong {
      background: var(--wrong-bg);
      color: var(--wrong-text);
    }

    .review-q {
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .review-ans {
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .review-ans strong {
      color: var(--text-main);
    }

    .review-exp {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--option-border);
      color: var(--text-muted);
      font-size: 0.84rem;
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    @keyframes correctPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.025); box-shadow: 0 0 16px rgba(34, 197, 94, 0.35); }
      100% { transform: scale(1); }
    }

    @keyframes scorePop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="brand">🚀 우주 탐험 퀴즈</div>
      <div class="header-badges">
        <div class="streak-pill" id="streakPill" aria-live="polite">🔥 <span id="streakValue">0</span>연속 정답!</div>
        <div class="best-pill" id="bestPill">최고: <span id="bestScoreValue">0</span> / 10</div>
        <div class="score-pill" id="scorePill">점수: <span id="scoreValue">0</span> / 10</div>
      </div>
    </header>

    <section id="quizScreen">
      <div class="quiz-controls">
        <button class="timer-toggle-btn" id="timerToggleBtn" type="button" aria-pressed="false">⏱️ 15초 타이머: 끔</button>
        <div class="timer-status" id="timerStatus">남은 시간: <span id="timerSeconds">15</span>초</div>
      </div>
      <div class="timer-track" id="timerTrack" aria-hidden="true">
        <div class="timer-bar" id="timerBar"></div>
      </div>

      <div class="progress-meta">
        <span id="questionCounter">문제 1 / 10</span>
        <span id="progressPercent">10%</span>
      </div>
      <div class="progress-track" aria-label="퀴즈 진행률">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <h2 class="question-text" id="questionText"></h2>
      <div class="options-list" id="optionsList"></div>

      <div class="feedback-box" id="feedbackBox" role="status" aria-live="polite"></div>
      <button class="next-btn" id="nextBtn" type="button">다음 문제 →</button>
    </section>

    <section class="results-screen" id="resultsScreen">
      <div class="emoji-reaction" id="resultEmoji">🧑‍🚀</div>
      <h2 class="results-title" id="resultTitle">탐사 완료!</h2>
      <div class="new-record-badge" id="newRecordBadge">🎉 신기록 달성!</div>
      <div class="results-score" id="finalScore">0 / 10</div>
      <p class="results-desc" id="resultDesc"></p>
      <button class="restart-btn" id="restartBtn" type="button">다시 도전하기 🔄</button>
      <button class="review-toggle-btn" id="reviewToggleBtn" type="button" aria-expanded="false">내 답안 및 해설 다시보기 📝</button>
      <div class="review-list" id="reviewList"></div>
    </section>
  </main>

  <script>
    const questions = [
      {
        q: "1961년 인류 최초로 우주 비행에 성공한 우주비행사는 누구일까요?",
        options: ["닐 암스트롱", "유리 가가린", "버즈 올드린", "존 글렌"],
        answer: 1,
        explanation: "소련의 유리 가가린은 1961년 4월 12일 보스토크 1호를 타고 인류 최초로 지구 궤도를 비행했습니다."
      },
      {
        q: "인류가 최초로 달 표면에 착륙한 아폴로 임무는 무엇인가요?",
        options: ["아폴로 8호", "아폴로 11호", "아폴로 13호", "아폴로 17호"],
        answer: 1,
        explanation: "1969년 7월 20일, 아폴로 11호의 닐 암스트롱과 버즈 올드린이 최초로 달 표면을 걸었습니다."
      },
      {
        q: "태양계를 벗어나 성간 우주로 진입한 최초의 인류 인공 탐사선은?",
        options: ["보이저 1호", "파이어니어 10호", "뉴허라이즌스호", "카시니호"],
        answer: 0,
        explanation: "1977년 발사된 보이저 1호는 2012년 태양권계면을 넘어 인류 최초로 성간 우주로 진입했습니다."
      },
      {
        q: "대한민국이 독자 기술로 개발한 한국형 발사체의 이름은 무엇인가요?",
        options: ["나로호", "다누리호", "누리호", "아리랑호"],
        answer: 2,
        explanation: "누리호(KSLV-II)는 대한민국이 독자 개발한 3단형 우주발사체입니다."
      },
      {
        q: "2021년 화성에 착륙한 로버 '퍼서비어런스'와 함께 화성 하늘을 최초로 비행한 헬리콥터의 이름은?",
        options: ["인제뉴어티(Ingenuity)", "큐리오시티(Curiosity)", "소저너(Sojourner)", "스피릿(Spirit)"],
        answer: 0,
        explanation: "인제뉴어티는 지구 외 행성에서 최초로 동력 제어 비행에 성공한 소형 헬리콥터입니다."
      },
      {
        q: "허블 우주망원경의 뒤를 이어 2021년 발사된 적외선 관측 전문 차세대 우주망원경은?",
        options: ["케플러 우주망원경", "제임스 웹 우주망원경", "찬드라 우주망원경", "스피처 우주망원경"],
        answer: 1,
        explanation: "제임스 웹 우주망원경(JWST)은 정교한 육각형 금박 거울로 초기 우주의 별과 은하를 관측합니다."
      },
      {
        q: "2022년 발사되어 달 궤도를 돌며 임무를 수행 중인 대한민국 최초의 달 탐사선 이름은?",
        options: ["다누리", "천리안", "무궁화", "우리별"],
        answer: 0,
        explanation: "'달'과 '누리다'를 합친 다누리(KPLO)는 대한민국 최초의 달 궤도선입니다."
      },
      {
        q: "토성의 고리를 통과하며 토성과 위성 타이탄, 엔셀라두스를 정밀 탐사한 탐사선은?",
        options: ["갈릴레오호", "주노호", "카시니-하위헌스호", "마젤란호"],
        answer: 2,
        explanation: "카시니-하위헌스호는 13년간 토성계를 탐사하고 타이탄 표면에 착륙선을 내려보냈습니다."
      },
      {
        q: "2015년 명왕성을 최초로 근접 비행하며 하트 모양 지형을 촬영한 탐사선은?",
        options: ["뉴허라이즌스호", "로제타호", "메신저호", "돈(Dawn)호"],
        answer: 0,
        explanation: "뉴허라이즌스호는 2015년 7월 명왕성을 근접 통과하며 선명한 표면 사진을 지구로 전송했습니다."
      },
      {
        q: "지구 상공 약 400km 궤도를 돌며 다국적 우주인들이 연구를 수행하는 거대 유인 우주 시설은?",
        options: ["미르 우주정거장", "스카이랩", "국제우주정거장(ISS)", "루나 게이트웨이"],
        answer: 2,
        explanation: "국제우주정거장(ISS)은 미국, 러시아, 유럽, 일본 등 여러 국가가 협력해 운영하는 우주 연구 시설입니다."
      }
    ];

    const BEST_SCORE_KEY = "spaceQuizBestScore";
    const TIMER_LIMIT = 15;

    let activeQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let streak = 0;
    let bestScore = loadBestScore();
    let hasStoredBest = hasBestScoreInStorage();
    let answered = false;
    let timerEnabled = false;
    let timerInterval = null;
    let remainingSeconds = TIMER_LIMIT;
    let userAnswers = [];

    const scorePill = document.getElementById("scorePill");
    const scoreValue = document.getElementById("scoreValue");
    const bestScoreValue = document.getElementById("bestScoreValue");
    const streakPill = document.getElementById("streakPill");
    const streakValue = document.getElementById("streakValue");
    const timerToggleBtn = document.getElementById("timerToggleBtn");
    const timerStatus = document.getElementById("timerStatus");
    const timerSeconds = document.getElementById("timerSeconds");
    const timerTrack = document.getElementById("timerTrack");
    const timerBar = document.getElementById("timerBar");
    const questionCounter = document.getElementById("questionCounter");
    const progressPercent = document.getElementById("progressPercent");
    const progressBar = document.getElementById("progressBar");
    const questionText = document.getElementById("questionText");
    const optionsList = document.getElementById("optionsList");
    const feedbackBox = document.getElementById("feedbackBox");
    const nextBtn = document.getElementById("nextBtn");
    const quizScreen = document.getElementById("quizScreen");
    const resultsScreen = document.getElementById("resultsScreen");
    const resultEmoji = document.getElementById("resultEmoji");
    const resultTitle = document.getElementById("resultTitle");
    const newRecordBadge = document.getElementById("newRecordBadge");
    const finalScore = document.getElementById("finalScore");
    const resultDesc = document.getElementById("resultDesc");
    const restartBtn = document.getElementById("restartBtn");
    const reviewToggleBtn = document.getElementById("reviewToggleBtn");
    const reviewList = document.getElementById("reviewList");

    function hasBestScoreInStorage() {
      try {
        return localStorage.getItem(BEST_SCORE_KEY) !== null;
      } catch (e) {
        return false;
      }
    }

    function loadBestScore() {
      try {
        const saved = localStorage.getItem(BEST_SCORE_KEY);
        const parsed = saved !== null ? parseInt(saved, 10) : 0;
        return Number.isNaN(parsed) ? 0 : parsed;
      } catch (e) {
        return 0;
      }
    }

    function saveBestScore(newBest) {
      bestScore = newBest;
      hasStoredBest = true;
      bestScoreValue.textContent = bestScore;
      try {
        localStorage.setItem(BEST_SCORE_KEY, String(newBest));
      } catch (e) {
        // Ignore storage errors in restricted environments
      }
    }

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    }

    function prepareShuffledQuestions() {
      const shuffledQuestions = shuffleArray(questions);
      activeQuestions = shuffledQuestions.map((item) => {
        const correctOptionText = item.options[item.answer];
        const shuffledOptions = shuffleArray(item.options);
        const newAnswerIdx = shuffledOptions.indexOf(correctOptionText);
        return {
          q: item.q,
          options: shuffledOptions,
          answer: newAnswerIdx,
          explanation: item.explanation
        };
      });
    }

    function updateStreakUI() {
      streakValue.textContent = streak;
      if (streak >= 2) {
        streakPill.classList.remove("show");
        void streakPill.offsetWidth;
        streakPill.classList.add("show");
      } else {
        streakPill.classList.remove("show");
      }
    }

    function stopQuestionTimer() {
      if (timerInterval !== null) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateTimerUI() {
      if (!timerEnabled) {
        timerStatus.classList.remove("show", "urgent");
        timerTrack.classList.remove("show");
        timerBar.classList.remove("urgent");
        return;
      }
      timerStatus.classList.add("show");
      timerTrack.classList.add("show");
      timerSeconds.textContent = remainingSeconds;
      const pct = Math.max(0, (remainingSeconds / TIMER_LIMIT) * 100);
      timerBar.style.width = `${pct}%`;

      if (remainingSeconds <= 5) {
        timerStatus.classList.add("urgent");
        timerBar.classList.add("urgent");
      } else {
        timerStatus.classList.remove("urgent");
        timerBar.classList.remove("urgent");
      }
    }

    function startQuestionTimer() {
      stopQuestionTimer();
      remainingSeconds = TIMER_LIMIT;
      updateTimerUI();
      if (!timerEnabled || answered) return;

      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateTimerUI();
        if (remainingSeconds <= 0) {
          stopQuestionTimer();
          handleTimeout();
        }
      }, 1000);
    }

    function renderQuestion(moveFocus = false) {
      answered = false;
      const item = activeQuestions[currentIdx];
      const step = currentIdx + 1;
      const pct = Math.round((step / activeQuestions.length) * 100);

      questionCounter.textContent = `문제 ${step} / ${activeQuestions.length}`;
      progressPercent.textContent = `${pct}%`;
      progressBar.style.width = `${pct}%`;
      questionText.textContent = item.q;

      feedbackBox.className = "feedback-box";
      feedbackBox.textContent = "";
      nextBtn.className = "next-btn";
      nextBtn.textContent = step === activeQuestions.length ? "결과 보기 ✨" : "다음 문제 →";

      optionsList.innerHTML = "";
      item.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.innerHTML = `<span>${optText}</span><span class="status-icon"></span>`;
        btn.addEventListener("click", () => selectOption(idx, btn));
        optionsList.appendChild(btn);
      });

      startQuestionTimer();

      if (moveFocus) {
        const firstOption = optionsList.querySelector(".option-btn");
        if (firstOption) firstOption.focus();
      }
    }

    function selectOption(selectedIdx, selectedBtn) {
      if (answered) return;
      answered = true;
      stopQuestionTimer();

      const item = activeQuestions[currentIdx];
      const allBtns = optionsList.querySelectorAll(".option-btn");
      allBtns.forEach((btn) => (btn.disabled = true));

      const isCorrect = selectedIdx === item.answer;
      if (isCorrect) {
        score++;
        streak++;
        scoreValue.textContent = score;
        scorePill.classList.remove("bump");
        void scorePill.offsetWidth;
        scorePill.classList.add("bump");

        selectedBtn.classList.add("correct");
        selectedBtn.querySelector(".status-icon").textContent = "✅";
        feedbackBox.className = "feedback-box show correct";
        feedbackBox.textContent = `정답입니다! ${item.explanation}`;
      } else {
        streak = 0;
        selectedBtn.classList.add("wrong");
        selectedBtn.querySelector(".status-icon").textContent = "❌";
        const correctBtn = allBtns[item.answer];
        correctBtn.classList.add("correct");
        correctBtn.querySelector(".status-icon").textContent = "✅";

        feedbackBox.className = "feedback-box show wrong";
        feedbackBox.textContent = `아쉽네요! ${item.explanation}`;
      }

      updateStreakUI();

      userAnswers.push({
        questionNumber: currentIdx + 1,
        q: item.q,
        selectedText: item.options[selectedIdx],
        correctText: item.options[item.answer],
        isCorrect,
        isTimeout: false,
        explanation: item.explanation
      });

      nextBtn.classList.add("show");
      nextBtn.focus();
    }

    function handleTimeout() {
      if (answered) return;
      answered = true;

      const item = activeQuestions[currentIdx];
      const allBtns = optionsList.querySelectorAll(".option-btn");
      allBtns.forEach((btn) => (btn.disabled = true));

      streak = 0;
      updateStreakUI();

      const correctBtn = allBtns[item.answer];
      if (correctBtn) {
        correctBtn.classList.add("correct");
        correctBtn.querySelector(".status-icon").textContent = "✅";
      }

      feedbackBox.className = "feedback-box show wrong";
      feedbackBox.textContent = `시간 초과! 정답은 '${item.options[item.answer]}'입니다. ${item.explanation}`;

      userAnswers.push({
        questionNumber: currentIdx + 1,
        q: item.q,
        selectedText: "시간 초과 (미응답)",
        correctText: item.options[item.answer],
        isCorrect: false,
        isTimeout: true,
        explanation: item.explanation
      });

      nextBtn.classList.add("show");
      nextBtn.focus();
    }

    function renderReviewNotes() {
      reviewList.innerHTML = "";
      userAnswers.forEach((entry) => {
        const card = document.createElement("div");
        card.className = `review-card ${entry.isCorrect ? "correct" : "wrong"}`;

        const statusLabel = entry.isCorrect ? "✅ 정답" : (entry.isTimeout ? "⏰ 시간 초과 (오답)" : "❌ 오답");
        const correctLine = entry.isCorrect
          ? ""
          : `<div class="review-ans">실제 정답: <strong>${entry.correctText}</strong></div>`;

        card.innerHTML = `
          <div class="review-card-header">
            <span>문제 ${entry.questionNumber}</span>
            <span class="review-badge ${entry.isCorrect ? "correct" : "wrong"}">${statusLabel}</span>
          </div>
          <div class="review-q">${entry.q}</div>
          <div class="review-ans">내 선택: <strong>${entry.selectedText}</strong></div>
          ${correctLine}
          <div class="review-exp">💡 ${entry.explanation}</div>
        `;
        reviewList.appendChild(card);
      });
    }

    function showResults() {
      stopQuestionTimer();
      quizScreen.style.display = "none";
      resultsScreen.classList.add("show");
      finalScore.textContent = `${score} / ${activeQuestions.length}점`;

      const isNewRecord = !hasStoredBest ? score > 0 : score > bestScore;
      if (score > bestScore || !hasStoredBest) {
        saveBestScore(Math.max(score, bestScore));
      }
      if (isNewRecord) {
        newRecordBadge.classList.add("show");
      } else {
        newRecordBadge.classList.remove("show");
      }

      if (score === 10) {
        resultEmoji.textContent = "🌌🏆";
        resultTitle.textContent = "전설의 우주 사령관!";
        resultDesc.textContent = "모든 문제를 맞히셨습니다! 지금 당장 화성 탐사선에 탑승하셔도 되겠어요.";
      } else if (score >= 7) {
        resultEmoji.textContent = "🧑‍🚀🚀";
        resultTitle.textContent = "숙련된 우주 비행사!";
        resultDesc.textContent = "훌륭한 우주 탐험 지식을 가지고 계시네요! 은하계 여행 준비가 거의 끝났습니다.";
      } else if (score >= 4) {
        resultEmoji.textContent = "🛰️✨";
        resultTitle.textContent = "지구 궤도 탐험가!";
        resultDesc.textContent = "기본기가 탄탄하시네요! 조금만 더 훈련하면 심우주 탐사도 거뜬합니다.";
      } else {
        resultEmoji.textContent = "🔭🌙";
        resultTitle.textContent = "호기심 많은 별지기!";
        resultDesc.textContent = "우주 여행의 첫걸음을 떼셨군요! 다시 도전하며 우주 지식을 넓혀보세요.";
      }

      reviewList.classList.remove("show");
      reviewToggleBtn.setAttribute("aria-expanded", "false");
      reviewToggleBtn.textContent = "내 답안 및 해설 다시보기 📝";
      renderReviewNotes();

      restartBtn.focus();
    }

    timerToggleBtn.addEventListener("click", () => {
      timerEnabled = !timerEnabled;
      timerToggleBtn.setAttribute("aria-pressed", String(timerEnabled));
      timerToggleBtn.textContent = timerEnabled ? "⏱️ 15초 타이머: 켬" : "⏱️ 15초 타이머: 끔";
      if (timerEnabled && !answered && !resultsScreen.classList.contains("show")) {
        startQuestionTimer();
      } else {
        stopQuestionTimer();
        updateTimerUI();
      }
    });

    reviewToggleBtn.addEventListener("click", () => {
      const isShowing = reviewList.classList.toggle("show");
      reviewToggleBtn.setAttribute("aria-expanded", String(isShowing));
      reviewToggleBtn.textContent = isShowing ? "내 답안 및 해설 접기 ▲" : "내 답안 및 해설 다시보기 📝";
    });

    nextBtn.addEventListener("click", () => {
      if (currentIdx < activeQuestions.length - 1) {
        currentIdx++;
        renderQuestion(true);
      } else {
        showResults();
      }
    });

    restartBtn.addEventListener("click", () => {
      stopQuestionTimer();
      currentIdx = 0;
      score = 0;
      streak = 0;
      userAnswers = [];
      scoreValue.textContent = "0";
      updateStreakUI();
      newRecordBadge.classList.remove("show");
      resultsScreen.classList.remove("show");
      quizScreen.style.display = "block";
      prepareShuffledQuestions();
      renderQuestion(true);
    });

    document.addEventListener("keydown", (e) => {
      if (resultsScreen.classList.contains("show")) return;

      const allBtns = Array.from(optionsList.querySelectorAll(".option-btn"));
      if (!answered && allBtns.length > 0) {
        const currentFocusIdx = allBtns.indexOf(document.activeElement);
        if (e.key === "ArrowDown" || e.key === "ArrowRight") {
          e.preventDefault();
          const nextIdx = currentFocusIdx < 0 ? 0 : (currentFocusIdx + 1) % allBtns.length;
          allBtns[nextIdx].focus();
        } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
          e.preventDefault();
          const prevIdx = currentFocusIdx <= 0 ? allBtns.length - 1 : currentFocusIdx - 1;
          allBtns[prevIdx].focus();
        } else if (e.key >= "1" && e.key <= "4") {
          const idx = Number(e.key) - 1;
          if (allBtns[idx]) {
            e.preventDefault();
            selectOption(idx, allBtns[idx]);
          }
        }
      }
    });

    bestScoreValue.textContent = bestScore;
    prepareShuffledQuestions();
    renderQuestion(true);
  </script>
</body>
</html>
